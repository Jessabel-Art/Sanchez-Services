name: Build & publish deploy branch

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Safety gate: the new frontend needs the PHP API to be live on the server first.
    # Set the repository variable PHP_BACKEND_READY=true only after the backend, database and
    # config are in place (see docs/CUTOVER_RUNBOOK.md). Until then this job refuses to publish.
    env:
      SS_APP_ROOT: ${{ vars.SS_APP_ROOT }}   # absolute path of ss-app on the server, e.g. /home/<user>/ss-app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refuse to publish before the PHP backend is ready
        if: ${{ vars.PHP_BACKEND_READY != 'true' }}
        run: |
          echo "PHP_BACKEND_READY is not 'true' — not publishing. See docs/CUTOVER_RUNBOOK.md." >&2
          exit 1

      - name: Install & build
        run: |
          npm ci
          npm run build

      - name: Add the PHP API front controller to the web root
        run: |
          test -n "$SS_APP_ROOT" || { echo "Set repository variable SS_APP_ROOT" >&2; exit 1; }
          mkdir -p dist/api
          cp backend/public/api/index.php backend/public/api/.htaccess dist/api/
          printf "<?php\nreturn %s;\n" "'$SS_APP_ROOT'" > dist/api/app-root.php
          test -f dist/.htaccess && grep -q "RewriteRule ^api/ - \[L\]" dist/.htaccess
          ! grep -rq "firestore.googleapis.com" dist/assets/

      - name: Push dist to deploy branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy       # output branch
          folder: dist         # built files
          clean: true
